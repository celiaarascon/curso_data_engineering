models:
  - name: stg_workout_data__exercises
    description: "Staging: exercises - contrato (enforced)."
    config:
      contract:
        enforced: true
    columns:
      - name: exercise_id
        data_type: varchar
        description: "Unique identifier for each exercise."
        constraints:
          - type: not_null
      - name: exercise_name
        data_type: varchar
        description: "Name of the exercise"
        constraints:
          - type: not_null
      - name: primary_muscle
        data_type: varchar
        description: "Main muscle group"
        constraints:
          - type: not_null
      - name: secondary_muscle
        data_type: varchar
        description: "Additional muscle group"
      - name: movement_type
        data_type: varchar
        description: "Type of movement performed"
      - name: equipment
        data_type: varchar
        description: "Equipment required"

  - name: stg_workout_data__session_exercises
    description: "Staging: session exercises - contrato (enforced)."
    config:
      contract:
        enforced: true
    columns:
      - name: entry_id
        data_type: text
        description: "Unique entry id"
        constraints:
          - type: not_null
      - name: session_id
        data_type: text
        description: "Reference session id"
        constraints:
          - type: not_null
      - name: exercise_id
        data_type: text
        description: "Reference exercise id"
        constraints:
          - type: not_null
      - name: sets
        data_type: integer
        description: "Number of sets"
      - name: reps
        data_type: integer
        description: "Number of repetitions"
      - name: weight_kg
        data_type: float
        description: "Weight used (kg)"
      - name: volume_kg
        data_type: float
        description: "Total training volume"
      - name: estimated_1rm
        data_type: float
        description: "Estimated 1RM (kg)"


  - name: stg_workout_data__users
    description: "Staging: users"
    config:
      contract:
        enforced: false
    columns:
      - name: user_sk
        data_type: text
        description: "Surrogate key for user"
        constraints:
        - type: not_null
      - name: user_id
        data_type: text
        description: "Unique user id"
        constraints:
        - type: not_null
      - name: first_name
        data_type: text
        description: "User first name"
      - name: last_name
        data_type: text
        description: "User last name"
      - name: fk_age_id
        data_type: text
        description: "Foreign key to age dimension"
      - name: fk_sex_id
        data_type: text
        description: "Foreign key to sex dimension"
      - name: fk_experience_level_id
        data_type: text
        description: "Foreign key to experience level dimension"
  
  - name: stg_workout_data__users_age
    description: "Staging: age groups dimension"
    columns:
    - name: age_id
      data_type: text
      description: "Surrogate key for age group"
    - name: age_group
      data_type: text
      description: "Age group category"
    - name: age_group_description
      data_type: text
      description: "Age group description"
  
  - name: stg_workout_data__users_sex
    description: "Staging: sex dimension"
    columns:
    - name: sex_id
      data_type: text
      description: "Surrogate key for sex"
    - name: sex
      data_type: text
      description: "Sex code: M/F"
    - name: sex_description
      data_type: text
      description: "Sex description"

  - name: stg_workout_data__users_experience_level
    description: "Staging: experience level dimension"
    columns:
    - name: experience_level_id
      data_type: text
      description: "Surrogate key for experience level"
    - name: experience_level
      data_type: text
      description: "Experience level code"
    - name: experience_level_description
      data_type: text
      description: "Experience level description"
  
  - name: stg_workout_data__sessions
    description: "Staging: sessions"
    config:
      contract:
        enforced: true
    columns:
      - name: session_id
        data_type: text
        description: "Unique session id"
        constraints:
          - type: not_null
      - name: user_id
        data_type: text
        description: "User who did the session"
        constraints:
          - type: not_null
      - name: session_date
        data_type: text
        description: "Date of session (ISO format)"
        tests:
          - not_null
      - name: session_goal
        data_type: text
        description: "Goal of session"
      - name: duration_min
        data_type: integer
        description: "Duration in minutes"
      - name: subjective_effort
        data_type: integer
        description: "User's subjective effort"

  - name: stg_workout_data__muscule_activation_estimate
    description: "Staging: muscle activation estimates"
    config:
      contract:
        enforced: true
    columns:
      - name: id
        data_type: text
        description: "activation record id"
        constraints:
          - type: not_null
      - name: exercise_id
        data_type: text
        description: "reference exercise"
        constraints:
          - type: not_null
      - name: muscle
        data_type: text
        description: "muscle name"
      - name: activation_score
        data_type: numeric
        description: "activation numeric estimate"