models:
  - name: stg_workout_data__exercises
    description: "Staging: exercises - contrato (enforced)."
    config:
      contract:
        enforced: true
    columns:
      - name: exercise_id
        data_type: varchar
        description: "Unique identifier for each exercise."
        constraints:
          - type: not_null
      - name: exercise_name
        data_type: varchar
        description: "Name of the exercise"
        constraints:
          - type: not_null
      - name: primary_muscle
        data_type: varchar
        description: "Main muscle group"
        constraints:
          - type: not_null
      - name: secondary_muscle
        data_type: varchar
        description: "Additional muscle group"
      - name: movement_type
        data_type: varchar
        description: "Type of movement performed"
      - name: equipment
        data_type: varchar
        description: "Equipment required"

  - name: stg_workout_data__session_exercises
    description: "Staging: cleaned session exercises with calculated volume and foreign keys"
    config:
      contract:
        enforced: false
    columns:
    - name: entry_sk
      data_type: text
      description: "Surrogate key for session exercise"
      constraints:
        - type: not_null
        - type: unique
    - name: entry_id
      data_type: text
      description: "Unique entry id"
      constraints:
        - type: not_null
    - name: session_id
      data_type: text
      description: "Session id"
      constraints:
        - type: not_null
    - name: exercise_id
      data_type: text
      description: "Exercise id"
      constraints:
        - type: not_null
    - name: sets
      data_type: integer
      description: "Number of sets"
    - name: reps
      data_type: integer
      description: "Number of reps"
    - name: weight_kg
      data_type: decimal(8,2)
      description: "Weight in kg"
    - name: volume_kg
      data_type: decimal(8,2)
      description: "Total volume calculated (sets * reps * weight)"
    - name: estimated_1_rep_max
      data_type: decimal(8,2)
      description: "Estimated one rep maximum"


  - name: stg_workout_data__users
    description: "Staging: users"
    config:
      contract:
        enforced: false
    columns:
      - name: user_sk
        data_type: text
        description: "Surrogate key for user"
        constraints:
        - type: not_null
      - name: user_id
        data_type: text
        description: "Unique user id"
        constraints:
        - type: not_null
      - name: first_name
        data_type: text
        description: "User first name"
      - name: last_name
        data_type: text
        description: "User last name"
      - name: fk_age_id
        data_type: text
        description: "Foreign key to age dimension"
      - name: fk_sex_id
        data_type: text
        description: "Foreign key to sex dimension"
      - name: fk_experience_level_id
        data_type: text
        description: "Foreign key to experience level dimension"
      - name: _fivetran_synced
        description: "Timestamp de sincronización desde la capa bronze/ingest"
        tests:
          - not_null
  
  - name: stg_workout_data__users_age
    description: "Staging: age groups dimension"
    columns:
    - name: age_id
      data_type: text
      description: "Surrogate key for age group"
    - name: age_group
      data_type: text
      description: "Age group category"
    - name: age_group_description
      data_type: text
      description: "Age group description"
  
  - name: stg_workout_data__users_sex
    description: "Staging: sex dimension"
    columns:
    - name: sex_id
      data_type: text
      description: "Surrogate key for sex"
    - name: sex
      data_type: text
      description: "Sex code: M/F"
    - name: sex_description
      data_type: text
      description: "Sex description"

  - name: stg_workout_data__users_experience_level
    description: "Staging: experience level dimension"
    columns:
    - name: experience_level_id
      data_type: text
      description: "Surrogate key for experience level"
    - name: experience_level
      data_type: text
      description: "Experience level code"
    - name: experience_level_description
      data_type: text
      description: "Experience level description"
  
  - name: stg_workout_data__sessions
    description: "Staging: sessions"
    config:
      contract:
        enforced: false
    columns:
    - name: session_sk
      data_type: text
      description: "Surrogate key for session"
      constraints:
        - type: not_null
        - type: unique
    - name: session_id
      data_type: text
      description: "Unique session id"
      constraints:
        - type: not_null
    - name: user_id
      data_type: text
      description: "User who did the session"
      constraints:
        - type: not_null
    - name: duration_minutes
      data_type: integer
      description: "Duration in minutes"
    - name: fk_session_goal_id
      data_type: text
      description: "Foreign key to session goals dimension"
    - name: fk_subjective_effort_id
      data_type: text
      description: "Foreign key to subjective effort dimension"
    - name: fk_session_date_id
      data_type: text
      description: "Foreign key to session dates dimension"

  - name: stg_workout_data__session_subjective_effort
    description: "Staging: subjective effort dimension with categories"
    config:
      contract:
        enforced: true
    columns:
    - name: subjective_effort_id
      data_type: text
      description: "Surrogate key for subjective effort"
      constraints:
        - type: not_null
        - type: unique
    - name: subjective_effort
      data_type: integer
      description: "Numeric subjective effort value"
      constraints:
        - type: not_null
    - name: subjective_effort_description
      data_type: text
      description: "Effort category (Low: 1-6, Medium: 7-8, High: 9-10)"

  - name: stg_workout_data__session_goals
    description: "Staging: distinct session goals dimension"
    config:
      contract:
        enforced: true
    columns:
    - name: fk_session_goal_id
      data_type: text
      description: "Surrogate key for session goal"
      constraints:
        - type: not_null
        - type: unique
    - name: session_goal
      data_type: text
      description: "Formatted session goal description"
      constraints:
        - type: not_null

  - name: stg_workout_data__session_dates
    description: "Staging: session dates with extracted components"
    config:
      contract:
        enforced: true
    columns:
    - name: fk_session_date_id
      data_type: text
      description: "Surrogate key for session date"
      constraints:
        - type: not_null
        - type: unique
    - name: session_date
      data_type: date
      description: "Date of session"
      constraints:
        - type: not_null
    - name: session_year
      data_type: integer
      description: "Year of session"
    - name: session_month
      data_type: integer
      description: "Month of session"
    - name: session_day
      data_type: integer
      description: "Day of session"

  - name: stg_workout_data__muscule_activation_estimate
    description: "Staging: muscle activation estimates"
    config:
      contract:
        enforced: true
    columns:
      - name: id
        data_type: text
        description: "activation record id"
        constraints:
          - type: not_null
      - name: exercise_id
        data_type: text
        description: "reference exercise"
        constraints:
          - type: not_null
      - name: muscle
        data_type: text
        description: "muscle name"
      - name: activation_score
        data_type: numeric
        description: "activation numeric estimate"