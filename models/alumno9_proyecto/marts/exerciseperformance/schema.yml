models:
  - name: fact_exercise_oerformance
    description: "Exercise performance metrics with weekly progress tracking"
    columns:
      - name: entry_id
        description: "Unique identifier for each exercise entry"
        tests:
          - unique
          - not_null

      - name: fk_user_id
        description: "Foreign key referencing the user"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: fk_exercise_id
        description: "Foreign key referencing the exercise"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_exercises')
                field: exercise_id
      - name: fk_session_id
        description: "Foreign key referencing the workout session"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_session')
                field: session_id
      - name: fk_date_id
        description: "Foreign key referencing the date dimension"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
      - name: weight_kg
        description: "Weight used for the exercise in kilograms"
        tests:
          - not_null

      - name: volumen_kg
        description: "Total volume lifted in kilograms (sets x reps x weight)"
      - name: estimated_1rm
        description: "Estimated one-repetition maximum weight"
      - name: diff_weight_vs_1rm
        description: "Difference between estimated 1RM and actual weight used"
      - name: session_goal
        description: "Goal of the training session"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['strength', 'hypertrophy', 'endurance', 'recovery']

      - name: intensity_category
        description: "Training intensity category based on percentage of 1RM (Strength, Hypertrophy, Endurance)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Strength', 'Hypertrophy', 'Endurance', 'recovery']

      - name: session_date
        description: "Date when the session occurred"
        tests:
          - not_null

      - name: weight_change_from_start
        description: "Absolute change in weight from the first session"
      - name: weeks_since_start
        description: "Number of weeks since the first session"
      - name: weekly_progress_rate
        description: "Average weekly progress rate in kilograms, rounded to 1 decimal place"